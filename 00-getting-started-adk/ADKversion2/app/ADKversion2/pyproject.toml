[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ADKversion2"
version = "0.1.0"
description = "AgentCore Runtime Application using Google ADK"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3",
    "openlit>=1.35.5",
    "opentelemetry-exporter-otlp",
    "google-adk >= 1.17.0",
    "bedrock-agentcore >= 1.0.3",
    "botocore[crt] >= 1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
